  The Bullpen Capital portfolio entry (https://www.flickapp.com) is a DIFFERENT, DEFUNCT
  company — a sports fan-engagement group-chat app founded in Edinburgh by FanDuel
  co-founders Nigel Eccles and Rob Jones; it is deadpooled and flickapp.com now resolves to
  an unrelated Indonesian gambling spam site (verified 2026-07-20, soft-404 catch-all
  returning HTTP 200 for every path). That domain has been removed from this profile. This
  repo now profiles the LIVE company from the GV portfolio: Flick (https://flick.art), the
  AI filmmaking studio. The defunct flickapp.com company should be tracked separately (or
  dropped) rather than conflated here.
