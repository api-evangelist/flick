aid: flick
name: Flick
description: >-
  Flick is an AI filmmaking studio that lets creators direct short films with AI on an
  infinite, node-based canvas. Rather than a linear prompt-to-clip generator, Flick gives
  directors a nonlinear workspace to plan, iterate and assemble complete narratives of any
  length — generating scenes, keeping character faces and styles consistent across shots,
  controlling shot composition, and editing images by reference. The product is a web app
  with a free tier (300 credits) and paid plans from $5/month, plus a Creative Partner
  Program and a Filmmaker Residency for AI filmmakers. Flick was founded by Ray Wang
  (previously a founding engineer on the Instagram AI team) and award-winning filmmaker
  Zoey Zhang, and is Y Combinator- and GV-backed. Flick publishes product documentation, a
  blog and a verbatim llms.txt, but does not currently expose a public developer API,
  SDKs, webhooks or an MCP server — the /api/ surface is an internal application API that
  robots.txt explicitly disallows.
